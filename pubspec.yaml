name: al_ethiopi_real_estate
description: "الأثيوبي للعقارات | Al-Ethiopi Real Estate - Yemen property marketplace (Flutter + Firebase)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_messaging: ^15.1.0
  firebase_app_check: ^0.2.2

  # Auth
  google_sign_in: ^6.2.0

  # State management
  flutter_riverpod: ^2.4.0

  # UI / media
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.0
  flutter_svg: ^2.0.0

  # Device / sharing / contact
  image_picker: ^1.0.0
  flutter_image_compress: ^2.1.0
  share_plus: ^10.1.0
  url_launcher: ^6.2.0
  connectivity_plus: ^6.0.0
  shared_preferences: ^2.2.0
  flutter_local_notifications: ^17.0.0

  # Utilities
  equatable: ^2.0.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  fake_cloud_firestore: ^2.5.0
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800

flutter_native_splash:
  color: "#0B3D2E"
  image: assets/branding/logo.png
  color_dark: "#0B3D2E"
  image_dark: assets/branding/logo.png
  android: true
  ios: false
  web: false
  android_12:
    image: assets/branding/logo.png
    icon_background_color: "#0B3D2E"

flutter_launcher_icons:
  android: true
  ios: false
  web: false
  image_path: "assets/branding/ic_launcher_playstore.png"
  adaptive_icon_background: "#0B3D2E"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
